name: build

# Builds the debug APK and compiles the on-device checks.
# The engine is cross-compiled by its own Makefile (needs the NDK, Python
# and make), so this is slower than an ordinary app build: about five
# minutes of native build before Gradle even takes over.
#
# There is deliberately no emulator job: the Linux runners have no nested
# virtualization and the macOS ones never finish booting this image either,
# so the instrumented tests are compiled here and run where there is a real
# device or a working emulator:
#   ./gradlew connectedDebugAndroidTest -Pevvdroid.abis=arm64-v8a

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125
  # Every Latin-script language the engine ships, in one APK. Japanese is
  # left out until the wide-charset path it needs exists; Korean, Chinese
  # and Portuguese were never in the SDK this engine is transcribed from.
  EVVDROID_LANGS: lang/enus lang/engb lang/dede lang/eses lang/esus lang/frfr lang/frca lang/itit lang/plpl

jobs:
  build:
    name: debug APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out with the engine submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Build the debug APK and compile the device checks
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Pevvdroid.abis=arm64-v8a -Pevvdroid.langs="$EVVDROID_LANGS" --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: evvdroid-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
