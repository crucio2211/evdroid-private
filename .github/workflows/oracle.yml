name: oracle

# Our-side accent oracle, to hold against ETI measurements taken on real
# hardware. Builds the desktop phonemes harness (English only) and prints
# what our engine says each case is made of -- phones and word accents --
# into the run log, so no artifact storage is touched. Run it from the
# Actions tab or with: gh workflow run oracle -R crucio2211/evdroid-private
#
# Nothing here runs on this machine; that is the point. See README.

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language module to build (e.g. lang/enus, lang/eses)'
        required: false
        default: 'lang/enus'

permissions:
  contents: read

jobs:
  accents:
    name: our accents
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out without the engine submodule
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the private engine fork
        env:
          OPENVV16K_DEPLOY_KEY: ${{ secrets.OPENVV16K_DEPLOY_KEY }}
        run: |
          set -e
          [ -n "$OPENVV16K_DEPLOY_KEY" ] || { echo "OPENVV16K_DEPLOY_KEY is empty" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$OPENVV16K_DEPLOY_KEY" > ~/.ssh/openevv16k
          chmod 600 ~/.ssh/openevv16k
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/openevv16k -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
          git submodule update --init --recursive
          git -C native/openevv log --oneline -1

      - name: Lay our patches on
        run: |
          for patch in "$GITHUB_WORKSPACE"/native/patches/*.patch; do
            [ -e "$patch" ] || continue
            git -C native/openevv apply --whitespace=nowarn "$patch"
            echo "applied $(basename "$patch")"
          done

      - name: Build the phonemes harness
        working-directory: native/openevv
        run: make phonemes-bin LANGS="${{ inputs.lang }}" RULES="bytecode" -j"$(nproc)"

      - name: Say what our engine hears
        working-directory: native/openevv
        # With the hetero filter on, exactly like the app runs it: forced
        # readings must show up as annotations in the answers.
        env:
          EVV_HETERO: "on"
          EVV_HETERO_TRACE: "on"
          EVV_ANNO: "1"
        run: |
          echo "hetero-env=[$EVV_HETERO]"
          tag="$(basename "${{ inputs.lang }}")"
          cases="../accent-cases.txt"
          [ -f "../accent-cases-$tag.txt" ] && cases="../accent-cases-$tag.txt"
          bin="./build/phonemes-$tag"
          [ -x "$bin" ] || bin="./build/phonemes"
          "$bin" "$cases"

      - name: Show what the hetero filter writes
        working-directory: native/openevv
        # Calls the rewriting directly, past install questions: a wrong
        # answer names itself here.
        run: |
          make build/hetero LANGS="lang/enus" RULES="bytecode" -j"$(nproc)"
          printf '%s\n' 'I produce music.' 'they will produce it.' 'the produce was fresh.' 'the candidate won' 'unread messages' 'entries button' 'jose garcia is here' 'persona non grata' 'niña' 'ninya' > /tmp/hetero-cases.txt
          printf '%b\n' 'ni\361a' 'ma\361ana' >> /tmp/hetero-cases.txt
          ./build/hetero /tmp/hetero-cases.txt
